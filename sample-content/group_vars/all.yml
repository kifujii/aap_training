---
# ファイルに書くメモ。Job Template の Survey から上書きできる。
training_note: managed by AAP

# name_prefix はここへ書かない。ジョブテンプレートの Extra variables で渡す。
# AWSでサーバを作るときだけ使う。パスワードと resource_prefix はここへ書かず、起動時の Extra variables で渡す。
ec2_region: ap-northeast-1
vpc_cidr: 10.42.0.0/16
subnet_cidr: 10.42.1.0/24
# SSH（TCP 22）と PSRP（TCP 5985）を、どの接続元からも許可する。
# この研修ではこの値のまま使う。実際の運用では、接続してくるアドレスだけを書く。
# 学習後は、演習4の削除手順でサーバを消す。
allow_cidr: 0.0.0.0/0
linux_instance_type: t3.micro
windows_instance_type: t3.medium
notify_message: notification from AAP
