---
- name: Check the note file on Windows
  hosts: windows
  gather_facts: false
  environment: "{{ {'KRB5_CONFIG': playbook_dir + '/krb5.conf'} if (lookup('ansible.builtin.fileglob', playbook_dir + '/krb5.conf') | length > 0) else {} }}"

  tasks:
    - name: name_prefix is set
      ansible.builtin.assert:
        that:
          - name_prefix is defined
          - name_prefix is match('^[a-z][a-z0-9-]{1,12}$')
          - name_prefix is not match('.*-$')
        fail_msg: ジョブテンプレートの Extra variables に、演習1で決めた name_prefix を指定してください。

    - name: Read note.txt
      ansible.windows.slurp:
        src: 'C:\temp\{{ name_prefix }}-aap-training\note.txt'
      register: note_file

    - name: Decode note.txt
      ansible.builtin.set_fact:
        note_text: "{{ note_file.content | b64decode }}"

    - name: note.txt contains the hostname and the note
      ansible.builtin.assert:
        that:
          - inventory_hostname in note_text
          - training_note in note_text
        fail_msg: >-
          C:\temp\{{ name_prefix }}-aap-training\note.txt に
          {{ inventory_hostname }} または「{{ training_note }}」がありません。
