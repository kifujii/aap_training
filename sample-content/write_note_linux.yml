---
- name: Write a note file on Linux
  hosts: linux
  gather_facts: true

  tasks:
    - name: name_prefix is set
      ansible.builtin.assert:
        that:
          - name_prefix is defined
          - name_prefix is match('^[a-z][a-z0-9-]{1,12}$')
          - name_prefix is not match('.*-$')
        fail_msg: ジョブテンプレートの Extra variables に、演習1で決めた name_prefix を指定してください。

    - name: Load secrets.yml when vault is enabled
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets.yml"
      when: training_use_vault | default(false) | bool

    - name: Create the note directory
      ansible.builtin.file:
        path: "/tmp/{{ name_prefix }}-aap-training"
        state: directory
        mode: "0755"

    - name: Write note.txt
      ansible.builtin.copy:
        dest: "/tmp/{{ name_prefix }}-aap-training/note.txt"
        mode: "0644"
        content: |
          hostname: {{ inventory_hostname }}
          address: {{ ansible_host }}
          note: {{ training_note }}

    - name: Show the note written to note.txt
      ansible.builtin.debug:
        msg: "note.txt の note は {{ training_note }} です"

    - name: Write secret.txt
      ansible.builtin.copy:
        dest: "/tmp/{{ name_prefix }}-aap-training/secret.txt"
        mode: "0600"
        content: "{{ training_secret | default('') }}\n"
      when: training_secret is defined

    - name: Show the secret written to secret.txt
      ansible.builtin.debug:
        msg: "secret.txt に書いた値は {{ training_secret }} です"
      when: training_secret is defined
