---
# 経路B（既存サーバ）では managed.hosts の ansible_host を実サーバに書き換える。
# 経路A（EC2新規作成）では、provision_ec2.yml のログに出たプライベートIPを同じ場所へ書く。
# automation グループは provision_ec2.yml を localhost で実行するためだけに使う。
all:
  vars:
    ansible_user: ec2-user
    ansible_port: 22
  children:
    managed:
      hosts:
        srv1:
          ansible_host: 10.0.1.11
        srv2:
          ansible_host: 10.0.1.12
    automation:
      hosts:
        localhost:
          ansible_connection: local
