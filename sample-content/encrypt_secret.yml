---
# 演習9で、ansible-vault を実行できるサーバが無いときに使う。
# Survey の Password で受け取った2つの値から、実行環境の ansible-vault で暗号文を作る。
# 出力に出すのは暗号文の英数字だけで、復号用のパスワードと平文は出さない。
- name: Encrypt training_secret with ansible-vault in the execution environment
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Survey answers are set
      ansible.builtin.assert:
        that:
          - vault_password is defined
          - vault_password | length > 0
          - secret_value is defined
          - secret_value | length > 0
        fail_msg: Survey の2つの質問（復号用のパスワードと、暗号化する文字列）に答えてから起動してください。
        quiet: true

    - name: Encrypt the value
      block:
        - name: Create a temporary file for the vault password
          ansible.builtin.tempfile:
            state: file
            suffix: .vault
          register: vault_password_file

        - name: Write the vault password to the temporary file
          ansible.builtin.copy:
            content: "{{ vault_password }}"
            dest: "{{ vault_password_file.path }}"
            mode: "0600"
          no_log: true

        - name: Run ansible-vault encrypt
          ansible.builtin.command:
            argv:
              - ansible-vault
              - encrypt
              - --vault-password-file
              - "{{ vault_password_file.path }}"
              - --output
              - "-"
              - "-"
            stdin: "{{ secret_value }}"
            stdin_add_newline: false
          register: vault_result
          changed_when: false
          no_log: true

      always:
        - name: Remove the temporary file
          ansible.builtin.file:
            path: "{{ vault_password_file.path }}"
            state: absent
          when: vault_password_file.path is defined

    - name: The header of the encrypted text is the default one
      ansible.builtin.assert:
        that:
          - vault_result.stdout_lines[0] == '$ANSIBLE_VAULT;1.1;AES256'
        fail_msg: ansible-vault の出力が想定と違います。講師に確認してください。
        quiet: true

    - name: Show the encrypted text for secrets.yml
      ansible.builtin.debug:
        msg: "{{ vault_result.stdout_lines[1:] | map('trim') | join('') }}"
