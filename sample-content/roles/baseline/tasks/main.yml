---
- name: Read the current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_timezone
  changed_when: false

- name: Set the timezone
  ansible.builtin.command: timedatectl set-timezone {{ host_timezone }}
  when: current_timezone.stdout != host_timezone

- name: Install baseline packages
  ansible.builtin.dnf:
    name: "{{ baseline_packages }}"
    state: present

- name: Enable chronyd
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

- name: Write the login banner
  ansible.builtin.copy:
    dest: /etc/motd
    mode: "0644"
    content: |
      Host: {{ inventory_hostname }}
      Timezone: {{ host_timezone }}
      Managed by Ansible Automation Platform

- name: Write the list of managed peers
  ansible.builtin.template:
    src: peers.txt.j2
    dest: /etc/aap-training-peers
    mode: "0644"

# baseline_create_admin_user が true のときだけ secrets.yml を読む。
# ファイルが無い基礎演習では、この2タスクはスキップされる。
- name: Load the encrypted admin password
  ansible.builtin.include_vars: "{{ playbook_dir }}/secrets.yml"
  when: baseline_create_admin_user | bool
  no_log: true

- name: Create the local admin user
  ansible.builtin.user:
    name: "{{ baseline_admin_user }}"
    password: "{{ baseline_admin_password | default('unused') | password_hash('sha512') }}"
    update_password: on_create
    groups: wheel
    append: true
  when:
    - baseline_create_admin_user | bool
    - baseline_admin_password is defined
  no_log: true
