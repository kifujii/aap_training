---
# tasks file for haproxy
- name: install haproxy package
  package:
    name: haproxy
    state: present

- name: copy haproxy.cfg
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
  notify: restart haproxy service

- name: start and enable haproxy
  service:
    name: haproxy
    state: started
    enabled: true
